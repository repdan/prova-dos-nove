# =============================================================================
# QUAL MERCADO ESTA SENDO ESTUDADO
#
# O que vem abaixo e a base comum. A secao 'mercados' no fim do arquivo traz
# o que muda de um instrumento para outro, e e mesclada por cima desta base.
# Assim cada mercado declara so as suas diferencas.
# =============================================================================
mercado_ativo: "XAUUSD"

# =============================================================================
# CONFIGURACAO UNICA DO PROJETO
# Nenhum parametro de estrategia, dado ou custo deve estar hardcoded no codigo.
# Se voce quer mudar o comportamento do sistema, e aqui que voce mexe.
# =============================================================================

# -----------------------------------------------------------------------------
# CONEXAO COM O METATRADER 5
# -----------------------------------------------------------------------------
mt5:
  # Caminho do terminal. O terminal precisa estar ABERTO E LOGADO antes de rodar.
  caminho_terminal: "C:/Program Files/MetaTrader 5/terminal64.exe"

  # Nome do simbolo na corretora. Se ficar null, o script procura sozinho
  # entre os simbolos disponiveis usando a lista de padroes abaixo.
  simbolo: null
  padroes_busca_simbolo: ["HK50", "HKG33", "HSI", "HANGSENG", "HK_50"]

  # Fuso do servidor da corretora, como NOME de fuso - nunca como numero de
  # horas. Medido em 02/09/2026: o servidor da corretora abre o pregao as 03:15 no
  # inverno e as 04:15 no verao, ou seja, ele MUDA no horario de verao (EET/EEST).
  # Um offset fixo acertaria metade do ano e erraria a outra em 60 minutos.
  # null = o script infere sozinho a partir dos dados.
  fuso_servidor: "Europe/Athens"

# -----------------------------------------------------------------------------
# COLETA DE DADOS HISTORICOS
# -----------------------------------------------------------------------------
coleta:
  # Timeframes a coletar. O primeiro da lista e o prioritario do projeto.
  timeframes: ["M15", "M5"]

  # Data inicial da busca. O MT5 devolve apenas o que o terminal tem em cache,
  # entao pedir desde 2010 e seguro: ele simplesmente entrega o que existir.
  data_inicial: "2010-01-01"

  # Pasta onde os arquivos parquet sao gravados.
  pasta_saida: "data/historico"

# -----------------------------------------------------------------------------
# PREGAO / SESSAO DE NEGOCIACAO
# Horarios no fuso de Hong Kong (Asia/Hong_Kong), que e o fuso do ativo.
# -----------------------------------------------------------------------------
pregao:
  # sessoes  - abre e fecha em horarios fixos (indices)
  # continuo - roda de domingo a noite a sexta a noite (forex, metais)
  tipo: "sessoes"

  # Mercado continuo: intervalo entre candles, em multiplos do timeframe, a
  # partir do qual se considera que o mercado estava FECHADO em vez de faltar
  # candle. Abaixo disso e buraco de dado e entra no relatorio de qualidade.
  candles_ate_ser_pausa: 4

  fuso_do_ativo: "Asia/Hong_Kong"

  # DECISAO DO PROJETO: operar apenas o pregao regular (onde esta a liquidez).
  # A estrategia e de rompimento e depende de volume - after-hours polui o sinal.
  # Para incluir a sessao noturna, adicione a faixa dela nesta lista.
  sessoes_regulares:
    - {inicio: "09:15", fim: "12:00"}
    - {inicio: "13:00", fim: "16:30"}

  # Dias da semana negociados (0=segunda ... 6=domingo).
  dias_negociados: [0, 1, 2, 3, 4]

# -----------------------------------------------------------------------------
# TRATAMENTO E QUALIDADE DOS DADOS
# -----------------------------------------------------------------------------
tratamento:
  # Um "gap" e a ausencia de um candle esperado dentro do horario de pregao.
  # Gaps normais (fim de semana, feriado, intervalo do almoco) nao sao problema.
  # O relatorio separa os dois tipos para voce enxergar buracos reais na base.

  # Acima de quantos candles seguidos ausentes um gap vira suspeito de falha
  # de coleta e nao apenas de mercado fechado.
  candles_faltando_para_alertar: 4

  # Remove candles com volume zero (barras "fantasma" que o MT5 as vezes cria).
  remover_volume_zero: true

  # Remove candles com OHLC inconsistente (ex: minima > maxima).
  remover_ohlc_invalido: true

  # Descarta o dia inteiro quando ele tem candles demais faltando.
  # Motivo concreto: no historico do HK50 na corretora, tudo antes de marco/2022
  # vem com ~1 candle por dia em vez de 25 - sao barras-fantasma do terminal,
  # nao pregao. Um dia com 4% dos candles esperados nao e um pregao curto, e
  # ausencia de dado, e treinar ML em cima disso e treinar em ruido.
  # Fracao da MEDIANA de candles por dia abaixo da qual o dia e descartado.
  # Medido no HK50 da corretora: 2020 e 2021 vem com mediana de 7 candles por dia
  # (28% de um pregao), enquanto 2022 em diante vem com os 25 completos.
  # 0.35 descarta os dias de 28% e ainda preserva meio-pregao real (~45%),
  # que existe de verdade em vesperas de feriado em Hong Kong.
  densidade_minima_do_dia: 0.35

  # Corte explicito de inicio do historico utilizavel. O filtro de densidade
  # acima ja limpa dia a dia, mas este corte deixa a decisao visivel em vez de
  # depender de um limiar: no HK50 da corretora o dado so fica integro em 2022.
  # null = sem corte, usa tudo que sobreviver ao filtro de densidade.
  data_inicial_utilizavel: "2022-01-01"

# -----------------------------------------------------------------------------
# CUSTOS DE OPERACAO
# ATENCAO: sem numeros corretos aqui o backtest MENTE. Os campos com null sao
# preenchidos automaticamente a partir da especificacao do contrato no MT5;
# a comissao NAO vem pela API e precisa ser informada manualmente.
# -----------------------------------------------------------------------------
# Tudo aqui e em PONTOS DE INDICE (1.0 = o indice andou 1 ponto), nunca no
# "point" do MT5 (0.01). Misturar as duas unidades erra os custos por 100x.
custos:
  # Spread mediano medido em 60.000 candles M15 dentro do pregao regular.
  # Fora do pregao ele sobe para ~5.0, mais um motivo para o filtro de sessao.
  spread_indice: 4.5

  # Medido com mt5.order_calc_profit em 02/09/2026 (conta em USD):
  # 1 lote, movimento de 100 pontos de indice = 12.75 USD.
  valor_ponto_por_lote: 0.1275   # USD por ponto de indice, por lote
  moeda: "USD"

  # Confirmado na especificacao do contrato em 03/09/2026:
  # "0.1 USD por lote, instantanea pelo volume, transacoes de entrada".
  # So na entrada, entao 0.78 pontos de indice por giro completo.
  comissao_por_lote: 0.1

  # Cenario de spread para o backtest:
  #   null  = usa o spread REAL de cada candle do historico
  #   numero = forca esse spread em todos os candles
  # Existe porque o spread do HK50 mudou de patamar durante a base (9-10 pontos
  # ate 2024, 1.6-4.5 depois). Medir o periodo inteiro com o spread historico
  # mistura dois regimes; forcar um valor responde "e se o custo de hoje
  # valesse para tudo?". Nenhum dos dois e a verdade sozinho - por isso os dois.
  spread_forcado: null
  slippage_indice: 0.5         # derrapagem estimada por ponta, em pontos de indice
  tamanho_contrato: 1.0

  # SWAP - custo de carregar a posicao de um dia para o outro.
  # Lido do MT5 em 02/09/2026 (swap_mode = 1, ou seja, em points de 0.01):
  #   swap_long = -550 points  -> -5.50 pontos de indice por noite, por lote
  #   swap_short = +3.05       -> +0.03 pontos de indice por noite, por lote
  # Uma noite comprado custa MAIS que o spread inteiro. Ignorar isso faz o
  # backtest premiar posicao overnight de graca, que foi exatamente o erro da
  # primeira rodada da Etapa 3.
  swap_compra_indice: -5.50
  swap_venda_indice: 0.03
  dia_swap_triplo: 4           # 0=segunda ... 4=sexta (MT5: rollover3days=5=sexta)

# -----------------------------------------------------------------------------
# BACKTEST
# -----------------------------------------------------------------------------
backtest:
  capital_inicial: 10000.0     # so para expressar drawdown em %; lote e fixo

  # Encerrar posicao aberta na virada do pregao?
  #   false = baseline puro, exatamente como a estrategia foi descrita
  #           (so sai no rompimento da media oposta, custe o que custar)
  #   true  = day trade de verdade, sem exposicao noturna
  # Medido na Etapa 2.5: o pior gap entre pregoes foi de 1.673 pontos, e o
  # swap de posicao comprada e -550. O relatorio roda as duas versoes lado a
  # lado para a escolha sair de numero, nao de intuicao.
  fechar_no_fim_do_pregao: false

  # O QUE FAZER QUANDO UMA POSICAO E ENCERRADA PELO ROMPIMENTO OPOSTO
  #
  # Medido em 03/09/2026: das 1.211 saidas, 841 (69%) viraram entrada
  # contraria no mesmo candle e 369 (30%) nao. A diferenca nao e aleatoria - e
  # a propria regra de entrada: quando o preco vinha CAVALGANDO FORA do canal
  # e um unico candle atravessa o canal inteiro, o candle anterior nao estava
  # "dentro", e a regra de dentro-para-fora bloqueia a entrada nova.
  #
  #   regra  - deixa a regra decidir (comportamento atual: inverte em 69%)
  #   sempre - inverte em toda saida, mesmo sem passar pelo canal
  #   nunca  - nunca inverte no mesmo candle; espera o preco voltar para
  #            dentro do canal e romper de novo
  politica_inversao: "regra"

# -----------------------------------------------------------------------------
# ESTRATEGIA
# -----------------------------------------------------------------------------
estrategia:
  periodo_canal: 20            # periodo das medias de maxima e de minima

  # Lote MINIMO permitido pelo simbolo (volume_min = 0.01). Nesta fase o
  # resultado e medido em PONTOS, nao em dinheiro, entao o lote so define a
  # escala da conta de exemplo - e o minimo mantem a demo fora de risco.
  # Com 0.01: 1 ponto de indice = 0.001275 USD.
  lote: 0.01
  modo_saida: "stop_gain"      # stop_gain | trailing | fibo_expansion | ml_probabilidade
  fibo_nivel: 2.0              # 200% da largura do canal
  ml_limiar_saida: 0.45        # probabilidade minima para manter a posicao aberta

  # Como o canal e formado:
  #   media    - media movel das maximas e das minimas (o que voce descreveu)
  #   donchian - maior maxima e menor minima da janela (Donchian classico)
  # Sao coisas diferentes: o canal por media e mais estreito e reage mais
  # rapido. Ficam os dois para a Etapa 4 comparar com o mesmo engine.
  tipo_canal: "media"

  # Que preco precisa sair do canal para valer como rompimento:
  #   fechamento - o candle precisa FECHAR fora (conservador, menos sinal falso)
  #   extremo    - basta o pavio furar (mais sinais, mais ruido)
  preco_referencia: "fechamento"

  periodo_atr: 14              # so para features de contexto do ML

  # -------------------------------------------------------------------------
  # FILTRO DE VOLUME
  #
  # Descoberto em 03/09/2026 varrendo 23 indicadores: o volume do candle
  # ANTERIOR ao rompimento, relativo a media dos ultimos 100 candles, e a
  # unica medida que separa trade bom de ruim de forma consistente. E o
  # sentido e o inverso do esperado - volume BAIXO antes do rompimento e o
  # que da certo. A leitura provavel: volume alto antes e climax, exaustao de
  # um movimento que ja aconteceu; volume baixo e mercado que ainda nao reagiu.
  #
  # Validado em walk-forward de 44 meses (limiar do passado, teste no mes
  # seguinte): fator de lucro passa de 1.02 para 1.20, e os trades descartados
  # ficam em 0.87 - o filtro separa, nao apenas encolhe a amostra.
  #
  # O limiar de 0.88 e a mediana dos limiares que o walk-forward escolheu ao
  # longo dos 44 meses (faixa 0.84 a 0.91). Rompimento so vale se o volume do
  # candle anterior estiver ABAIXO desse multiplo da media.
  # -------------------------------------------------------------------------
  # O limiar de 0.70 NAO e o pico da varredura - e o meio de um plato largo.
  # Medido no periodo de teste (fora dos 12 meses iniciais): 0.50 da 1.19,
  # 0.60 da 1.14, 0.70 da 1.14, 0.80 da 1.09, sem filtro da 1.03. Escolher o
  # pico seria repetir o erro do periodo 160; escolher o meio de um plato
  # amplo e o que costuma sobreviver. Reescolher o limiar todo mes foi testado
  # e e PIOR que fixar (+958 pontos contra +5.786) - o adaptativo persegue
  # ruido.
  filtro_volume_ativo: true
  filtro_volume_janela: 100      # candles da media de referencia
  filtro_volume_limiar: 0.70     # razao maxima para o sinal valer

  # -------------------------------------------------------------------------
  # STOP - ate onde aceitar estar errado
  #
  #   nenhum          sem stop (regra base original)
  #   atr             entrada -/+ stop_mult_atr x ATR
  #   candle_entrada  extremo contrario do candle do sinal, menos a folga
  #   canal_externo   banda oposta do canal na entrada, menos a folga
  #   trailing_forca  como o atr, mas acompanha o preco sem afrouxar
  #
  # stop_breakeven_atr: depois desse tanto de ATR a favor, o stop vai para o
  # preco de entrada e o trade deixa de poder perder. null desliga.
  # -------------------------------------------------------------------------
  # Medido em 03/09/2026, periodo de teste, com o filtro de volume ligado:
  #   nenhum          1.14      candle_entrada folga 0.25   1.02  <- apertado
  #   atr 1.00        1.03      candle_entrada folga 1.0    1.17
  #   atr 1.50        1.23      canal_externo folga 0.25    1.19
  #   atr 1.75        1.23      canal_externo folga 1.0     1.19
  #   atr 2.00        1.21      trailing_forca 2.5x         0.73  <- destroi
  #   atr 2.50        1.20      trailing_forca 4.0x         0.95
  #   atr 4.00        1.18      breakeven em 1 ATR          0.84  <- destroi
  #
  # 2.0 e o MEIO do plato 1.5-2.5, nao o pico. Escolher pico e como escolher
  # o periodo 160.
  #
  # Por que trailing e breakeven falham, apesar de parecerem prudentes:
  #   trailing 2.5x -> ganho medio cai de 257 para 156, e os 10 melhores
  #                    trades encolhem 41%. Ele corta a cauda que paga tudo.
  #   breakeven     -> os vencedores caem de 228 para 130. O stop no zero a
  #                    zero e atingido antes de o movimento se desenvolver.
  #   atr 1.5x      -> ganho medio 256 (era 257), top 10 identicos, e a perda
  #                    media cai de 145 para 111. Corta perda sem tocar ganho.
  tipo_stop: "atr"
  stop_mult_atr: 2.0
  stop_folga_atr: 0.25
  stop_breakeven_atr: null

  # OBSOLETO - substituido por 'tipo_stop' acima, que congela o ATR no momento
  # da entrada em vez de recalcular o nivel a cada candle. Mantido desligado
  # para nao existirem dois stops simultaneos.
  #
  # O que a medicao diz (com o filtro de volume ligado, periodo de teste):
  #   sem stop  fator 1.14
  #   2.0 x ATR fator 1.19
  #   2.5 x ATR fator 1.21
  #   3.0 x ATR fator 1.17
  #   4.0 x ATR fator 1.17
  #   1.0 x ATR fator 1.00   <- apertado demais: o gap atravessa
  #
  # O ganho e modesto e vem do lugar certo: a perda media cai de 145 para 133
  # enquanto o ganho medio quase nao se move (257 -> 256). O plato 2.0-4.0 e
  # largo, o que da confianca; abaixo de 1.5 o stop vira prejuizo.
  #
  # ATENCAO: o stop e executado no PIOR entre o nivel e a abertura do candle,
  # porque stop garante execucao e nao preco. Assumir preenchimento no nivel
  # exato inflava o resultado de fator 1.12 para 1.39 - mais da metade do
  # ganho era ficcao de execucao.
  stop_catastrofico_ativo: false
  stop_catastrofico_atr: 3.0

# =============================================================================
# MERCADOS
# Cada perfil e mesclado por cima da base. Escolha em 'mercado_ativo' no topo.
# =============================================================================
mercados:

  # ---------------------------------------------------------------------------
  # HK50 - congelado. Um giro custa 22% de um candle M15, o 151o pior entre os
  # 304 simbolos liquidos da corretora. Mantido para comparacao e para o dia em
  # que quisermos uma estrategia adequada a ele.
  # ---------------------------------------------------------------------------
  HK50:
    mt5:
      simbolo: "HK50"
    coleta:
      pasta_saida: "data/historico/HK50"
      timeframes: ["M15", "M5"]
    pregao:
      tipo: "sessoes"
      fuso_do_ativo: "Asia/Hong_Kong"
      sessoes_regulares:
        - {inicio: "09:15", fim: "12:00"}
        - {inicio: "13:00", fim: "16:30"}
      dias_negociados: [0, 1, 2, 3, 4]
    tratamento:
      densidade_minima_do_dia: 0.35
      data_inicial_utilizavel: "2022-01-01"
    custos:
      spread_indice: 4.5
      valor_ponto_por_lote: 0.1275
      comissao_por_lote: 0.1
      slippage_indice: 0.5
      swap_compra_indice: -5.50
      swap_venda_indice: 0.03

  # ---------------------------------------------------------------------------
  # XAUUSD - o novo alvo. Um giro custa 2.1% de um candle M15 (4o entre os 304),
  # tem 28,4 anos de historico e correlacao de 0.25-0.37 com tudo o mais, o que
  # o torna a aposta independente do conjunto.
  #
  # Contrato: 100 oz por lote, digitos 2, ponto 0.01.
  # 1 dolar de movimento = 100 USD por lote, entao 1 "ponto" = 1 USD por lote.
  # ---------------------------------------------------------------------------
  XAUUSD:
    mt5:
      simbolo: "XAUUSD"
    coleta:
      pasta_saida: "data/historico/XAUUSD"
      timeframes: ["M15", "M5"]
      data_inicial: "1998-01-01"
    pregao:
      tipo: "continuo"
      fuso_do_ativo: "UTC"
      # Domingo (6) entra: o mercado abre na noite de domingo.
      dias_negociados: [0, 1, 2, 3, 4, 6]
      candles_ate_ser_pausa: 4
    tratamento:
      # Mercado continuo tem dias legitimamente curtos - domingo abre so as
      # 22h UTC (8 candles M15) e sexta fecha cedo. Limiar baixo para nao
      # descartar esses; o custo real de operar num domingo ralo aparece
      # sozinho no spread que o backtest cobra.
      densidade_minima_do_dia: 0.05

      # Medido em 04/09/2026: de 1998 a 2015 o terminal entrega 2 candles por
      # dia (2% de um pregao) e 2016 entrega 22%. Sao barras residuais, o mesmo
      # padrao do HK50 antes de 2022. O dado so fica integro em 2017: 96% em
      # 2017 e 100% de 2018 em diante.
      #
      # Resultado: 10 anos utilizaveis, nao os 28 que o terminal alega. Ainda
      # assim sao 225.551 candles M15 contra 27.099 do HK50.
      data_inicial_utilizavel: "2017-01-01"
    custos:
      # Medido em 04/09/2026: spread 22 points = 0.22 USD, ATR M15 de 7.56 USD.
      # Um giro completo consome 5.8% de um candle tipico.
      spread_indice: 0.22          # em USD (a "unidade de preco" do ouro)
      valor_ponto_por_lote: 100.0  # 1 USD de movimento = 100 USD por lote
      comissao_por_lote: 0.1
      slippage_indice: 0.02        # ~9% de um spread, mesma proporcao do HK50
      swap_compra_indice: -0.68    # -67.97 points x 0.01
      swap_venda_indice: 0.36      # +35.87 points x 0.01 (vendido RECEBE)
    estrategia:
      # Zerados de proposito: sao os parametros calibrados no HK50 e nao ha
      # razao para transferirem. Serao remedidos no ouro antes de valerem.
      filtro_volume_ativo: false
      tipo_stop: "nenhum"
