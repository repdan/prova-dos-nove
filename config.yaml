# =============================================================================
# CONFIGURACAO UNICA DO PROJETO
# Nenhum parametro de estrategia, dado ou custo deve estar hardcoded no codigo.
# Se voce quer mudar o comportamento do sistema, e aqui que voce mexe.
# =============================================================================

# -----------------------------------------------------------------------------
# CONEXAO COM O METATRADER 5
# -----------------------------------------------------------------------------
mt5:
  # Caminho do terminal. O terminal precisa estar ABERTO E LOGADO antes de rodar.
  caminho_terminal: "C:/Program Files/MetaTrader 5/terminal64.exe"

  # Nome do simbolo na corretora. Se ficar null, o script procura sozinho
  # entre os simbolos disponiveis usando a lista de padroes abaixo.
  simbolo: null
  padroes_busca_simbolo: ["HK50", "HKG33", "HSI", "HANGSENG", "HK_50"]

  # Fuso do servidor da corretora, como NOME de fuso - nunca como numero de
  # horas. Medido em 02/09/2026: o servidor da corretora abre o pregao as 03:15 no
  # inverno e as 04:15 no verao, ou seja, ele MUDA no horario de verao (EET/EEST).
  # Um offset fixo acertaria metade do ano e erraria a outra em 60 minutos.
  # null = o script infere sozinho a partir dos dados.
  fuso_servidor: "Europe/Athens"

# -----------------------------------------------------------------------------
# COLETA DE DADOS HISTORICOS
# -----------------------------------------------------------------------------
coleta:
  # Timeframes a coletar. O primeiro da lista e o prioritario do projeto.
  timeframes: ["M15", "M5"]

  # Data inicial da busca. O MT5 devolve apenas o que o terminal tem em cache,
  # entao pedir desde 2010 e seguro: ele simplesmente entrega o que existir.
  data_inicial: "2010-01-01"

  # Pasta onde os arquivos parquet sao gravados.
  pasta_saida: "data/historico"

# -----------------------------------------------------------------------------
# PREGAO / SESSAO DE NEGOCIACAO
# Horarios no fuso de Hong Kong (Asia/Hong_Kong), que e o fuso do ativo.
# -----------------------------------------------------------------------------
pregao:
  fuso_do_ativo: "Asia/Hong_Kong"

  # DECISAO DO PROJETO: operar apenas o pregao regular (onde esta a liquidez).
  # A estrategia e de rompimento e depende de volume - after-hours polui o sinal.
  # Para incluir a sessao noturna, adicione a faixa dela nesta lista.
  sessoes_regulares:
    - {inicio: "09:15", fim: "12:00"}
    - {inicio: "13:00", fim: "16:30"}

  # Dias da semana negociados (0=segunda ... 6=domingo).
  dias_negociados: [0, 1, 2, 3, 4]

# -----------------------------------------------------------------------------
# TRATAMENTO E QUALIDADE DOS DADOS
# -----------------------------------------------------------------------------
tratamento:
  # Um "gap" e a ausencia de um candle esperado dentro do horario de pregao.
  # Gaps normais (fim de semana, feriado, intervalo do almoco) nao sao problema.
  # O relatorio separa os dois tipos para voce enxergar buracos reais na base.

  # Acima de quantos candles seguidos ausentes um gap vira suspeito de falha
  # de coleta e nao apenas de mercado fechado.
  candles_faltando_para_alertar: 4

  # Remove candles com volume zero (barras "fantasma" que o MT5 as vezes cria).
  remover_volume_zero: true

  # Remove candles com OHLC inconsistente (ex: minima > maxima).
  remover_ohlc_invalido: true

  # Descarta o dia inteiro quando ele tem candles demais faltando.
  # Motivo concreto: no historico do HK50 na corretora, tudo antes de marco/2022
  # vem com ~1 candle por dia em vez de 25 - sao barras-fantasma do terminal,
  # nao pregao. Um dia com 4% dos candles esperados nao e um pregao curto, e
  # ausencia de dado, e treinar ML em cima disso e treinar em ruido.
  # Fracao da MEDIANA de candles por dia abaixo da qual o dia e descartado.
  # Medido no HK50 da corretora: 2020 e 2021 vem com mediana de 7 candles por dia
  # (28% de um pregao), enquanto 2022 em diante vem com os 25 completos.
  # 0.35 descarta os dias de 28% e ainda preserva meio-pregao real (~45%),
  # que existe de verdade em vesperas de feriado em Hong Kong.
  densidade_minima_do_dia: 0.35

  # Corte explicito de inicio do historico utilizavel. O filtro de densidade
  # acima ja limpa dia a dia, mas este corte deixa a decisao visivel em vez de
  # depender de um limiar: no HK50 da corretora o dado so fica integro em 2022.
  # null = sem corte, usa tudo que sobreviver ao filtro de densidade.
  data_inicial_utilizavel: "2022-01-01"

# -----------------------------------------------------------------------------
# CUSTOS DE OPERACAO
# ATENCAO: sem numeros corretos aqui o backtest MENTE. Os campos com null sao
# preenchidos automaticamente a partir da especificacao do contrato no MT5;
# a comissao NAO vem pela API e precisa ser informada manualmente.
# -----------------------------------------------------------------------------
# Tudo aqui e em PONTOS DE INDICE (1.0 = o indice andou 1 ponto), nunca no
# "point" do MT5 (0.01). Misturar as duas unidades erra os custos por 100x.
custos:
  # Spread mediano medido em 60.000 candles M15 dentro do pregao regular.
  # Fora do pregao ele sobe para ~5.0, mais um motivo para o filtro de sessao.
  spread_indice: 4.5

  # Medido com mt5.order_calc_profit em 02/09/2026 (conta em USD):
  # 1 lote, movimento de 100 pontos de indice = 12.75 USD.
  valor_ponto_por_lote: 0.1275   # USD por ponto de indice, por lote
  moeda: "USD"

  # Confirmado na especificacao do contrato em 03/09/2026:
  # "0.1 USD por lote, instantanea pelo volume, transacoes de entrada".
  # So na entrada, entao 0.78 pontos de indice por giro completo.
  comissao_por_lote: 0.1

  # Cenario de spread para o backtest:
  #   null  = usa o spread REAL de cada candle do historico
  #   numero = forca esse spread em todos os candles
  # Existe porque o spread do HK50 mudou de patamar durante a base (9-10 pontos
  # ate 2024, 1.6-4.5 depois). Medir o periodo inteiro com o spread historico
  # mistura dois regimes; forcar um valor responde "e se o custo de hoje
  # valesse para tudo?". Nenhum dos dois e a verdade sozinho - por isso os dois.
  spread_forcado: null
  slippage_indice: 0.5         # derrapagem estimada por ponta, em pontos de indice
  tamanho_contrato: 1.0

  # SWAP - custo de carregar a posicao de um dia para o outro.
  # Lido do MT5 em 02/09/2026 (swap_mode = 1, ou seja, em points de 0.01):
  #   swap_long = -550 points  -> -5.50 pontos de indice por noite, por lote
  #   swap_short = +3.05       -> +0.03 pontos de indice por noite, por lote
  # Uma noite comprado custa MAIS que o spread inteiro. Ignorar isso faz o
  # backtest premiar posicao overnight de graca, que foi exatamente o erro da
  # primeira rodada da Etapa 3.
  swap_compra_indice: -5.50
  swap_venda_indice: 0.03
  dia_swap_triplo: 4           # 0=segunda ... 4=sexta (MT5: rollover3days=5=sexta)

# -----------------------------------------------------------------------------
# BACKTEST
# -----------------------------------------------------------------------------
backtest:
  capital_inicial: 10000.0     # so para expressar drawdown em %; lote e fixo

  # Encerrar posicao aberta na virada do pregao?
  #   false = baseline puro, exatamente como a estrategia foi descrita
  #           (so sai no rompimento da media oposta, custe o que custar)
  #   true  = day trade de verdade, sem exposicao noturna
  # Medido na Etapa 2.5: o pior gap entre pregoes foi de 1.673 pontos, e o
  # swap de posicao comprada e -550. O relatorio roda as duas versoes lado a
  # lado para a escolha sair de numero, nao de intuicao.
  fechar_no_fim_do_pregao: false

# -----------------------------------------------------------------------------
# ESTRATEGIA
# -----------------------------------------------------------------------------
estrategia:
  periodo_canal: 20            # periodo das medias de maxima e de minima

  # Lote MINIMO permitido pelo simbolo (volume_min = 0.01). Nesta fase o
  # resultado e medido em PONTOS, nao em dinheiro, entao o lote so define a
  # escala da conta de exemplo - e o minimo mantem a demo fora de risco.
  # Com 0.01: 1 ponto de indice = 0.001275 USD.
  lote: 0.01
  modo_saida: "stop_gain"      # stop_gain | trailing | fibo_expansion | ml_probabilidade
  fibo_nivel: 2.0              # 200% da largura do canal
  ml_limiar_saida: 0.45        # probabilidade minima para manter a posicao aberta

  # Como o canal e formado:
  #   media    - media movel das maximas e das minimas (o que voce descreveu)
  #   donchian - maior maxima e menor minima da janela (Donchian classico)
  # Sao coisas diferentes: o canal por media e mais estreito e reage mais
  # rapido. Ficam os dois para a Etapa 4 comparar com o mesmo engine.
  tipo_canal: "media"

  # Que preco precisa sair do canal para valer como rompimento:
  #   fechamento - o candle precisa FECHAR fora (conservador, menos sinal falso)
  #   extremo    - basta o pavio furar (mais sinais, mais ruido)
  preco_referencia: "fechamento"

  periodo_atr: 14              # so para features de contexto do ML

  # Rede de seguranca DESLIGADA por padrao: a estrategia base nao tem stop loss.
  # Serve para medir qual seria a perda maxima por trade se houvesse um limite.
  stop_catastrofico_ativo: false
  stop_catastrofico_atr: 3.0
